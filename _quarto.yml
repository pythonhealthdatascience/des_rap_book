project:
  type: website
  preview:
    browser: true
  render:
    - "*.qmd"
    - "pages/**/*.qmd"
    - "!_*.md"
    - "!examples/"

website:
  title: "DES RAP"
  google-analytics: "G-W2FC4GDHFK"
  cookie-consent: true
  page-navigation: true
  favicon: images/stars_logo_blue.png
  navbar:
    logo: images/stars_logo_white.png
    left:
      - text: Step-by-step guide
        href: pages/learn.qmd
      - text: Examples
        href: pages/intro/examples.qmd
      - text: Frameworks
        menu:
          - pages/frameworks/levels_of_rap.qmd
          - pages/frameworks/stars_reproducibility.qmd
      - text: Intros
        menu:
          - text: Intro to DES
            href: pages/intro/des.qmd
          - text: Intro to reproducibility and RAPs
            href: pages/intro/rap.qmd
          - text: Intro to FOSS
            href: pages/intro/foss.qmd
    right:
      - icon: github
        href: https://github.com/pythonhealthdatascience/des_rap_book
  announcement:
    dismissable: false
    content: |
      <div class="language-selector">
        Choose your language:&nbsp;&nbsp;
        <button class="language-button" onclick="setLanguage('python')">Python</button>
        <button class="language-button" onclick="setLanguage('r')">R</button>
      </div>
    position: below-navbar
  sidebar:
    - id: learn
      title: "Learn"
      style: "docked"
      contents:
        - text: Introduction
          href: pages/learn.qmd
        - section: "Setup"
          contents:
          - pages/setup/version.qmd
          - pages/setup/environment.qmd
          - pages/setup/package.qmd
          - pages/setup/code_structure.qmd
        - section: "Model inputs"
          contents:
          - pages/inputs/input_modelling.qmd
          - pages/inputs/input_data.qmd
          - pages/inputs/parameters_script.qmd
          - pages/inputs/parameters_file.qmd
          - pages/inputs/parameters_validation.qmd
        - section: "Model building"
          contents:
          - pages/model/distributions.qmd
          - pages/model/patients.qmd
          - pages/model/process.qmd
          - pages/model/logs.qmd
        - section: "Output analysis"
          contents:
          - pages/output_analysis/warmup.qmd
          - pages/output_analysis/outputs.qmd
          - pages/output_analysis/replications.qmd
          - pages/output_analysis/length_warmup.qmd
          - pages/output_analysis/n_reps.qmd
          - pages/output_analysis/parallel.qmd
        - section: "Experimentation"
          contents:
          - pages/experiments/scenarios.qmd
          - pages/experiments/tables_figures.qmd
          - pages/experiments/full_run.qmd
        - section: "Verification & validation"
          contents:
          - pages/verification_validation/verification_validation.qmd
          - pages/verification_validation/tests.qmd
          - pages/verification_validation/mathematical.qmd
          - pages/verification_validation/quality_assurance.qmd
        - section: "Style & documentation"
          contents:
          - pages/style_docs/linting.qmd
          - pages/style_docs/docstrings.qmd
          - pages/style_docs/github_actions.qmd
          - pages/style_docs/documentation.qmd
        - section: "Collaboration & sharing"
          contents:
          - pages/sharing/peer_review.qmd
          - pages/sharing/licence.qmd
          - pages/sharing/citation.qmd
          - pages/sharing/changelog.qmd
          - pages/sharing/archive.qmd
        - section: "Closing remarks"
          contents:
          - pages/further_info/conclusion.qmd
          - pages/further_info/feedback.qmd

  page-footer:
    left:
      - text: |
           The STARS project is supported by the Medical Research Council [grant number MR/Z503915/1].
    center:
      - text: |
          Part of the STARS research project.<br>
          Code licence: <a href="https://opensource.org/license/mit" target="_blank" rel="noopener">MIT</a>.  
          Text licence: <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC-BY-SA 4.0</a>.
    right:
      - text: |
          Heather, A., Monks, T., Mustafee, N., & Harper, A. (2025). DES RAP Book: Reproducible Discrete-Event Simulation in Python and R. https://github.com/pythonhealthdatascience/des_rap_book. https://doi.org/10.5281/zenodo.17094155.

format:
  html:
    theme:
      - cosmo
      - styles/theme.scss
    toc: true
    toc-depth: 2
    number-sections: false
    crossrefs-hover: false
    lightbox: true
    title-block-banner: images/banner.png
    title-block-banner-color: "#ffffff"
    css:
      - styles/headings.css
      - styles/general.css
      - styles/buttons.css
      - styles/language-selector.css
      - styles/callout.css
      - styles/tables.css
      - styles/webex.css
    filters:
      - filters/guidelines-filter.lua
    include-after-body:
      - scripts/webex.js
      - scripts/language-selector.js

params:
  language: "python"  # Default language parameter